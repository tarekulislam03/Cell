<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CHRONO</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=JetBrains+Mono:wght@400;700&family=VT323&display=swap"
    rel="stylesheet">
</head>

<body>
  <!-- Retro Outer Window Frame -->
  <div id="retro-window">
    <!-- Retro Title Bar (Theme-Colored Controls on Right) -->
    <div id="titlebar" data-tauri-drag-region>
      <div id="titlebar-left" data-tauri-drag-region>
      </div>

      <div id="titlebar-title" data-tauri-drag-region>
        <span class="title-text">CHRONO</span>
      </div>

      <div id="titlebar-controls">
        <button class="mac-btn mac-min" id="btn-min" title="Minimize">
          <svg viewBox="0 0 12 12">
            <path d="M2.5 6h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
          </svg>
        </button>
        <button class="mac-btn mac-max" id="btn-max" title="Maximize">
          <svg viewBox="0 0 12 12">
            <path d="M3.5 3.5l5 0m-5 0l0 5m5-5l-5 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
          </svg>
        </button>
        <button class="mac-btn mac-close" id="btn-close" title="Close">
          <svg viewBox="0 0 12 12">
            <path d="M3.5 3.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Main Terminal Viewport with Pixel Background -->
    <div id="viewport">
      <div id="bg-layer"></div>
      <div id="bg-overlay"></div>
      <div id="terminal-container">
        <div id="terminal"></div>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>

</html>
